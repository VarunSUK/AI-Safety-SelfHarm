[project]
name = "ai-safety-selfharm-eval"
version = "0.1.0"
description = "Self-harm risk evaluation harness: policy rubric, labeled eval dataset, LLM classifier, SQL analysis layer, and a two-reviewer QA workflow."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "altair>=5.3.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
